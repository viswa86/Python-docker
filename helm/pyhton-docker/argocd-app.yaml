apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyhton-docker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/viswa86/Python-docker.git
    targetRevision: master
    path: helm/pyhton-docker

  destination:
    server: https://kubernetes.default.svc
    namespace: pyhton-docker

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true